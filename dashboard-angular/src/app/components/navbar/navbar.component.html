<header class="h-16 bg-white/95 backdrop-blur-md border-b-2 border-slate-900 px-4 sm:px-6 flex items-center justify-between sticky top-0 z-30 min-w-0 text-slate-900">
  <!-- Left side: Page Title & Date -->
  <div class="flex items-center gap-2 sm:gap-4 shrink-0">
    <button 
      class="md:hidden text-slate-900 hover:text-teal-700 p-1 shrink-0 rounded-lg hover:bg-slate-100"
      (click)="onOpenSidebar()"
    >
      <lucide-icon [img]="MenuIcon" class="w-6 h-6"></lucide-icon>
    </button>
    <div class="min-w-0 flex flex-col">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-teal-600 border-2 border-slate-900 flex items-center justify-center text-white shrink-0 shadow-[2px_2px_0px_0px_#0f172a]">
          <svg class="w-4 h-4 text-white stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
        </div>
        <div>
          <h2 class="text-sm sm:text-base font-black text-slate-900 truncate tracking-tight leading-none uppercase">SagarDrishti</h2>
          <div class="text-[10px] font-bold text-slate-600 tracking-wide mt-0.5">Sindhudurg Basin Network</div>
        </div>
      </div>
      <div class="flex items-center mt-1 text-[10px] font-mono font-black">
        <span *ngIf="isOnline" class="bg-emerald-50 border border-emerald-300 px-2 py-0.5 rounded text-emerald-900">
          [{{ currentDate }} &bull; {{ currentTimeStr }}] ⚡ FIELD SYNC OK
        </span>
        <span *ngIf="!isOnline" class="bg-amber-50 border border-amber-300 px-2 py-0.5 rounded text-amber-900">
          [{{ currentDate }} &bull; {{ currentTimeStr }}] ❌ COMM LOSS
        </span>
      </div>
    </div>
  </div>

  <!-- Right side: Search, Notifications, Profile -->
  <div class="flex items-center gap-2 sm:gap-4 shrink-0">
    <!-- Search -->
    <div class="flex relative">
      <app-global-search></app-global-search>
    </div>

    <!-- Threshold Settings Button inlined -->
    <button
      (click)="openThresholdModal()"
      class="shrink-0 flex items-center space-x-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 px-3 py-1.5 text-xs font-semibold text-slate-800 border border-slate-200 transition-colors"
      title="Calibrate Thresholds"
    >
      <lucide-icon [img]="SlidersIcon" class="h-4 w-4 text-slate-700"></lucide-icon>
      <span class="hidden sm:inline">Calibrate</span>
    </button>

    <button 
      (click)="openWaModal()"
      class="shrink-0 p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-full transition-colors relative"
      title="WhatsApp Gateway Status"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/></svg>
      <span class="absolute top-1 right-1 w-2 h-2 bg-emerald-500 rounded-full border-2 border-white"></span>
    </button>
    
    <button class="shrink-0 p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-full transition-colors relative" title="Alerts">
      <lucide-icon [img]="BellIcon" class="w-5 h-5"></lucide-icon>
      <span class="absolute top-1 right-1 w-2 h-2 bg-amber-500 rounded-full border-2 border-white"></span>
    </button>
    
    <button class="shrink-0 flex items-center gap-2 p-1.5 hover:bg-slate-100 rounded-lg transition-colors">
      <div class="w-8 h-8 bg-teal-100 text-teal-800 rounded-full flex items-center justify-center font-bold text-xs">
        OP
      </div>
      <div class="hidden lg:block text-left">
        <div class="text-xs font-bold text-slate-900 leading-none">Operator</div>
        <div class="text-[10px] text-slate-500 font-medium mt-0.5">Field Admin</div>
      </div>
    </button>
  </div>
</header>
