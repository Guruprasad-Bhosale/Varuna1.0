<header class="h-16 bg-surface border-b border-border px-4 sm:px-6 flex items-center justify-between sticky top-0 z-30">
  <!-- Left side: Page Title & Date -->
  <div class="flex items-center gap-3 sm:gap-4">
    <button 
      class="md:hidden text-textMuted hover:text-navy p-1"
      (click)="onOpenSidebar()"
    >
      <lucide-icon [img]="MenuIcon" class="w-6 h-6"></lucide-icon>
    </button>
    <div>
      <h2 class="text-base sm:text-lg font-semibold text-navy">River Intelligence</h2>
      <div class="flex items-center gap-2 text-[10px] sm:text-xs text-textMuted">
        <span class="hidden sm:inline">{{ currentDate }}</span>
        <span class="hidden sm:inline w-1 h-1 rounded-full bg-border"></span>
        <span>Last sync: {{ lastSyncTime ? (lastSyncTime | date:'mediumTime') : 'Connecting...' }}</span>
      </div>
    </div>
  </div>

  <!-- Right side: Search, Notifications, Profile -->
  <div class="flex items-center gap-6">
    <!-- Search -->
    <div class="hidden md:flex relative">
      <lucide-icon [img]="SearchIcon" class="w-4 h-4 text-textMuted absolute left-3 top-1/2 -translate-y-1/2"></lucide-icon>
      <input 
        type="text" 
        placeholder="Search nodes or locations..." 
        class="pl-9 pr-4 py-1.5 text-sm bg-background border border-border rounded-md focus:outline-none focus:ring-1 focus:ring-teal focus:border-teal w-64 transition-all"
      />
    </div>

      <!-- Threshold Settings Button inlined -->
      <button
        (click)="openThresholdModal()"
        class="flex items-center space-x-1.5 rounded-lg border border-slate-700/80 bg-slate-800/80 px-2 sm:px-3 py-1.5 text-xs font-semibold text-slate-200 transition-colors hover:border-cyan-500/50 hover:bg-slate-700 hover:text-white"
      >
        <lucide-icon [img]="SlidersIcon" class="h-4 w-4 sm:h-3.5 sm:w-3.5 text-cyan-400"></lucide-icon>
        <span class="hidden sm:inline">Calibrate Thresholds</span>
      </button>

      <button 
        (click)="openWaModal()"
        class="p-2 text-textMuted hover:text-teal hover:bg-background rounded-full transition-colors relative"
        title="WhatsApp Gateway Status"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/></svg>
        <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-safe rounded-full border border-surface"></span>
      </button>
      
      <button class="p-2 text-textMuted hover:text-navy hover:bg-background rounded-full transition-colors relative" title="Alerts">
        <lucide-icon [img]="BellIcon" class="w-5 h-5"></lucide-icon>
        <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-moderate rounded-full border border-surface"></span>
      </button>
      <button class="flex items-center gap-2 p-1 hover:bg-background rounded-md transition-colors">
        <div class="w-8 h-8 bg-tealLight text-teal rounded-full flex items-center justify-center font-semibold text-sm">
          OP
        </div>
        <div class="hidden md:block text-left">
          <div class="text-sm font-medium text-navy leading-none">Operator</div>
          <div class="text-xs text-textMuted mt-1">Field Admin</div>
        </div>
      </button>
    </div>
</header>
