<header class="h-16 bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 sm:px-6 flex items-center justify-between sticky top-0 z-30 min-w-0 overflow-x-hidden text-slate-900">
  <!-- Left side: Page Title & Date -->
  <div class="flex items-center gap-2 sm:gap-4 shrink-0">
    <button 
      class="md:hidden text-slate-500 hover:text-slate-900 p-1 shrink-0"
      (click)="onOpenSidebar()"
    >
      <lucide-icon [img]="MenuIcon" class="w-6 h-6"></lucide-icon>
    </button>
    <div class="min-w-0 flex flex-col">
      <div class="flex items-center gap-2">
        <h2 class="text-sm sm:text-lg font-semibold text-slate-900 truncate">VARUNA <span class="hidden sm:inline">Intelligence</span></h2>
        <span *ngIf="isOnline" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">Online</span>
        <span *ngIf="!isOnline" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200">Offline</span>
      </div>
      <div class="flex items-center gap-1 sm:gap-2 text-[10px] sm:text-xs text-slate-600 truncate">
        <span class="hidden sm:inline">{{ currentDate }}</span>
        <span class="hidden sm:inline w-1 h-1 rounded-full bg-slate-300"></span>
        <span class="truncate bg-slate-100 sm:bg-transparent px-1.5 py-0.5 rounded-md text-slate-900 font-medium"><span class="hidden sm:inline text-slate-500">Last sync: </span>{{ currentSyncTime() }}</span>
      </div>
    </div>
  </div>

  <!-- Right side: Search, Notifications, Profile -->
  <div class="flex items-center gap-2 sm:gap-6 shrink-0">
    <!-- Search -->
    <div class="hidden md:flex relative">
      <lucide-icon [img]="SearchIcon" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></lucide-icon>
      <input 
        type="text" 
        placeholder="Search stations, rivers..." 
        class="pl-9 pr-4 py-1.5 text-sm bg-slate-50 border border-slate-200 rounded-md focus:outline-none focus:ring-1 focus:ring-teal-500 focus:border-teal-500 w-64 transition-all text-slate-900"
      />
    </div>

      <!-- Threshold Settings Button inlined -->
      <button
        (click)="openThresholdModal()"
        class="shrink-0 flex items-center space-x-1.5 rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-xs font-semibold text-slate-700 transition-colors hover:border-slate-400 hover:bg-slate-50 hover:text-slate-900 shadow-sm"
        title="Calibrate Thresholds"
      >
        <lucide-icon [img]="SlidersIcon" class="h-4 w-4 sm:h-3.5 sm:w-3.5 text-slate-600"></lucide-icon>
        <span class="hidden sm:inline">Calibrate</span>
      </button>

      <button 
        (click)="openWaModal()"
        class="shrink-0 p-1.5 sm:p-2 text-slate-500 hover:text-slate-900 hover:bg-slate-100 rounded-full transition-colors relative"
        title="WhatsApp Gateway Status"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/></svg>
        <span class="absolute top-1 right-1 w-2 h-2 bg-emerald-500 rounded-full border border-white"></span>
      </button>
      
      <button class="shrink-0 p-1.5 sm:p-2 text-slate-500 hover:text-slate-900 hover:bg-slate-100 rounded-full transition-colors relative" title="Alerts">
        <lucide-icon [img]="BellIcon" class="w-4 h-4 sm:w-5 sm:h-5"></lucide-icon>
        <span class="absolute top-1 right-1 w-2 h-2 bg-amber-500 rounded-full border border-white"></span>
      </button>
      
      <button class="shrink-0 flex items-center gap-2 p-1 hover:bg-slate-100 rounded-md transition-colors">
        <div class="w-7 h-7 sm:w-8 sm:h-8 bg-teal-100 text-teal-700 rounded-full flex items-center justify-center font-semibold text-xs sm:text-sm">
          OP
        </div>
        <div class="hidden lg:block text-left">
          <div class="text-sm font-medium text-slate-900 leading-none">Operator</div>
          <div class="text-xs text-slate-500 mt-1">Field Admin</div>
        </div>
      </button>
    </div>
</header>
