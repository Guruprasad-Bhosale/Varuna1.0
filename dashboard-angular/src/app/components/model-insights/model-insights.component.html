<div class="card-panel flex flex-col h-full bg-white rounded-xl border border-border shadow-sm">
  <div class="p-4 border-b border-border flex justify-between items-center bg-surfaceHover">
    <div class="flex items-center gap-2">
      <lucide-icon [img]="BrainIcon" class="w-4 h-4 text-teal"></lucide-icon>
      <h3 class="font-semibold text-navy">Model Insights</h3>
    </div>
  </div>

  <div class="p-4 flex-1 flex flex-col gap-4">
    <div class="flex justify-between items-end mb-2">
      <div>
        <div class="text-xs text-textMuted mb-1">Random Forest Classifier</div>
        <div class="text-2xl font-bold text-navy flex items-baseline gap-1">
          {{ confidence | number:'1.1-1' }}<span class="text-sm text-textMuted">% conf</span>
        </div>
      </div>
      <div class="flex items-center gap-1 text-safe text-xs font-medium bg-safeBg px-2 py-1 rounded">
        <lucide-icon [img]="TrendingUpIcon" class="w-3 h-3"></lucide-icon>
        Stable
      </div>
    </div>

    <div class="space-y-3">
      <div class="flex items-center justify-between text-sm">
        <span class="text-textMuted">Drift Detected</span>
        <span class="font-medium text-navy">No</span>
      </div>
      <div class="flex items-center justify-between text-sm">
        <span class="text-textMuted">Last Retrained</span>
        <span class="font-medium text-navy">48h ago</span>
      </div>
      <div class="flex items-center justify-between text-sm">
        <span class="text-textMuted">Top Feature</span>
        <span class="font-medium text-navy">Turbidity (42%)</span>
      </div>
    </div>

    <button class="mt-auto flex items-center justify-center gap-2 w-full py-2 bg-background border border-border hover:bg-surfaceHover rounded text-sm font-medium text-navy transition-colors">
      Model Performance Log
      <lucide-icon [img]="ArrowUpRightIcon" class="w-4 h-4"></lucide-icon>
    </button>
  </div>
</div>
