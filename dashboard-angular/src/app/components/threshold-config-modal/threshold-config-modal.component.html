<div *ngIf="isOpen" class="fixed inset-0 z-[1150] bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl p-6 max-w-xl w-full relative z-[1200]">
    <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
      <div class="flex items-center space-x-2">
        <lucide-icon [img]="SlidersIcon" class="h-5 w-5 text-slate-800"></lucide-icon>
        <h3 class="text-base font-bold text-slate-900">Threshold Calibration</h3>
      </div>
      <button
        (click)="close()"
        class="rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-900 transition-colors"
      >
        <lucide-icon [img]="XIcon" class="h-5 w-5"></lucide-icon>
      </button>
    </div>

    <form *ngIf="thresholdForm" [formGroup]="thresholdForm" class="max-h-[60vh] space-y-4 overflow-y-auto pr-1 text-sm text-slate-700">
      
      <!-- pH Bounds -->
      <div formGroupName="ph" class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
        <h4 class="font-bold text-slate-900 text-xs uppercase tracking-wider">pH Bounds (Two-Sided)</h4>
        <div class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-4">
          <div>
            <label class="text-[10px] font-bold uppercase tracking-wider text-slate-600">Warning Min</label>
            <input type="number" step="0.1" formControlName="warnMin"
                   class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 font-mono font-bold text-slate-900 bg-white focus:ring-2 focus:ring-teal-500 focus:border-teal-500 focus:outline-none transition-all" />
          </div>
          <div>
            <label class="text-[10px] font-bold uppercase tracking-wider text-slate-600">Safe Min</label>
            <input type="number" step="0.1" formControlName="safeMin"
                   class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 font-mono font-bold text-slate-900 bg-white focus:ring-2 focus:ring-teal-500 focus:border-teal-500 focus:outline-none transition-all" />
          </div>
          <div>
            <label class="text-[10px] font-bold uppercase tracking-wider text-slate-600">Safe Max</label>
            <input type="number" step="0.1" formControlName="safeMax"
                   class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 font-mono font-bold text-slate-900 bg-white focus:ring-2 focus:ring-teal-500 focus:border-teal-500 focus:outline-none transition-all" />
          </div>
          <div>
            <label class="text-[10px] font-bold uppercase tracking-wider text-slate-600">Warning Max</label>
            <input type="number" step="0.1" formControlName="warnMax"
                   class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 font-mono font-bold text-slate-900 bg-white focus:ring-2 focus:ring-teal-500 focus:border-teal-500 focus:outline-none transition-all" />
          </div>
        </div>
      </div>

      <!-- Other Metrics -->
      <div *ngFor="let param of metrics" [formGroupName]="param.id" class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
        <h4 class="font-bold text-slate-900 text-xs uppercase tracking-wider">{{ param.label }}</h4>
        <div class="mt-3 grid grid-cols-2 gap-3">
          <div>
            <label class="text-[10px] font-bold uppercase tracking-wider text-slate-600">Safe Upper Limit (🟢)</label>
            <input type="number" [step]="param.step" formControlName="safeMax"
                   class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 font-mono font-bold text-slate-900 bg-white focus:ring-2 focus:ring-teal-500 focus:border-teal-500 focus:outline-none transition-all" />
          </div>
          <div>
            <label class="text-[10px] font-bold uppercase tracking-wider text-slate-600">Warning Upper Limit (🟡)</label>
            <input type="number" [step]="param.step" formControlName="warnMax"
                   class="mt-1 w-full px-3 py-2 rounded-lg border border-slate-300 font-mono font-bold text-slate-900 bg-white focus:ring-2 focus:ring-teal-500 focus:border-teal-500 focus:outline-none transition-all" />
          </div>
        </div>
      </div>

    </form>

    <div class="mt-4 flex flex-col sm:flex-row items-center justify-between border-t border-slate-100 pt-4 gap-4 sm:gap-0">
      <button
        (click)="handleReset()"
        class="flex w-full sm:w-auto items-center justify-center space-x-1.5 px-4 py-2 text-xs font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition-all"
      >
        <lucide-icon [img]="RotateCcwIcon" class="h-4 w-4"></lucide-icon>
        <span>Reset CPCB Defaults</span>
      </button>
      <div class="flex w-full sm:w-auto space-x-3 items-center">
        <button
          (click)="close()"
          class="flex-1 sm:flex-none px-4 py-2 text-xs font-bold text-slate-600 hover:text-slate-900 transition-colors"
        >
          Cancel
        </button>
        <button
          (click)="handleSave()"
          class="flex flex-1 sm:flex-none items-center justify-center gap-2 px-5 py-2 text-xs font-bold text-white bg-teal-600 hover:bg-teal-700 rounded-xl transition-all shadow-sm"
        >
          <lucide-icon [img]="SaveIcon" class="h-4 w-4"></lucide-icon>
          <span>Save Changes</span>
        </button>
      </div>
    </div>
  </div>
</div>
