<div *ngIf="isOpen" class="fixed inset-0 z-[1150] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="stamp-card washi-tape-top bg-white rounded-2xl border-2 border-slate-900 shadow-[10px_10px_0px_0px_#0f172a] p-6 max-w-xl w-full relative z-[1200]">
    <div class="flex items-center justify-between border-b-2 border-slate-900 pb-3 mb-4">
      <div class="flex items-center space-x-2">
        <lucide-icon [img]="SlidersIcon" class="h-5 w-5 text-slate-900"></lucide-icon>
        <h3 class="text-base font-black text-slate-900 uppercase tracking-wider">Threshold Calibration Ledger</h3>
      </div>
      <button
        (click)="close()"
        class="rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-900"
      >
        <lucide-icon [img]="XIcon" class="h-5 w-5"></lucide-icon>
      </button>
    </div>

    <form *ngIf="thresholdForm" [formGroup]="thresholdForm" class="max-h-[60vh] space-y-4 overflow-y-auto pr-1 text-sm text-slate-700">
      
      <!-- pH Bounds -->
      <div formGroupName="ph" class="bg-white border-2 border-slate-900 rounded-xl p-4 space-y-3 shadow-[4px_4px_0px_0px_#0f172a]">
        <h4 class="font-black text-slate-900 uppercase tracking-wider text-xs">pH Bounds (Two-Sided)</h4>
        <div class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-4">
          <div>
            <label class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Warning Min</label>
            <input type="number" step="0.1" formControlName="warnMin"
                   class="mt-1 w-full px-3 py-2 rounded-xl border-2 border-slate-900 font-mono font-bold text-slate-900 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:shadow-[4px_4px_0px_0px_#0f172a] focus:outline-none transition-all shadow-[2px_2px_0px_0px_#0f172a]" />
          </div>
          <div>
            <label class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Safe Min</label>
            <input type="number" step="0.1" formControlName="safeMin"
                   class="mt-1 w-full px-3 py-2 rounded-xl border-2 border-slate-900 font-mono font-bold text-slate-900 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:shadow-[4px_4px_0px_0px_#0f172a] focus:outline-none transition-all shadow-[2px_2px_0px_0px_#0f172a]" />
          </div>
          <div>
            <label class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Safe Max</label>
            <input type="number" step="0.1" formControlName="safeMax"
                   class="mt-1 w-full px-3 py-2 rounded-xl border-2 border-slate-900 font-mono font-bold text-slate-900 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:shadow-[4px_4px_0px_0px_#0f172a] focus:outline-none transition-all shadow-[2px_2px_0px_0px_#0f172a]" />
          </div>
          <div>
            <label class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Warning Max</label>
            <input type="number" step="0.1" formControlName="warnMax"
                   class="mt-1 w-full px-3 py-2 rounded-xl border-2 border-slate-900 font-mono font-bold text-slate-900 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:shadow-[4px_4px_0px_0px_#0f172a] focus:outline-none transition-all shadow-[2px_2px_0px_0px_#0f172a]" />
          </div>
        </div>
      </div>

      <!-- Other Metrics -->
      <div *ngFor="let param of metrics" [formGroupName]="param.id" class="bg-white border-2 border-slate-900 rounded-xl p-4 space-y-3 shadow-[4px_4px_0px_0px_#0f172a]">
        <h4 class="font-black text-slate-900 uppercase tracking-wider text-xs">{{ param.label }}</h4>
        <div class="mt-3 grid grid-cols-2 gap-3">
          <div>
            <label class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Safe Upper Limit (🟢)</label>
            <input type="number" [step]="param.step" formControlName="safeMax"
                   class="mt-1 w-full px-3 py-2 rounded-xl border-2 border-slate-900 font-mono font-bold text-slate-900 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:shadow-[4px_4px_0px_0px_#0f172a] focus:outline-none transition-all shadow-[2px_2px_0px_0px_#0f172a]" />
          </div>
          <div>
            <label class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Warning Upper Limit (🟡)</label>
            <input type="number" [step]="param.step" formControlName="warnMax"
                   class="mt-1 w-full px-3 py-2 rounded-xl border-2 border-slate-900 font-mono font-bold text-slate-900 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500 focus:shadow-[4px_4px_0px_0px_#0f172a] focus:outline-none transition-all shadow-[2px_2px_0px_0px_#0f172a]" />
          </div>
        </div>
      </div>

    </form>

    <div class="mt-4 flex flex-col sm:flex-row items-center justify-between border-t-2 border-slate-900 pt-4 gap-4 sm:gap-0">
      <button
        (click)="handleReset()"
        class="stamp-btn flex w-full sm:w-auto items-center justify-center space-x-1.5 px-4 py-2 text-[11px] uppercase font-black tracking-wider text-slate-900 bg-white hover:bg-slate-100 rounded-xl transition-all"
      >
        <lucide-icon [img]="RotateCcwIcon" class="h-4 w-4"></lucide-icon>
        <span>Reset CPCB Defaults</span>
      </button>
      <div class="flex w-full sm:w-auto space-x-3 items-center">
        <button
          (click)="close()"
          class="flex-1 sm:flex-none px-4 py-2 text-[11px] font-black uppercase tracking-wider text-slate-500 hover:text-slate-800 transition-colors"
        >
          Cancel
        </button>
        <button
          (click)="handleSave()"
          class="stamp-btn flex flex-1 sm:flex-none items-center justify-center gap-2 px-5 py-2 text-[11px] uppercase font-black tracking-wider text-white bg-teal-600 hover:bg-teal-700 rounded-xl transition-all"
        >
          <lucide-icon [img]="SaveIcon" class="h-4 w-4"></lucide-icon>
          <span>Save Changes</span>
        </button>
      </div>
    </div>
  </div>
</div>
