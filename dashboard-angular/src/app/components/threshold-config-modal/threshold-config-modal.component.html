<div *ngIf="isOpen" class="fixed inset-0 z-[1150] bg-slate-900/40 backdrop-blur-sm">
  <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[1200] max-w-xl w-full bg-white rounded-2xl p-6 shadow-2xl border border-slate-200">
    <div class="flex items-center justify-between border-b border-slate-100 pb-4">
      <div class="flex items-center space-x-2">
        <lucide-icon [img]="SlidersIcon" class="h-5 w-5 text-teal-600"></lucide-icon>
        <h3 class="text-xl font-black text-slate-900">Threshold Calibration</h3>
      </div>
      <button
        (click)="close()"
        class="rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-900"
      >
        <lucide-icon [img]="XIcon" class="h-5 w-5"></lucide-icon>
      </button>
    </div>

    <form *ngIf="thresholdForm" [formGroup]="thresholdForm" class="mt-4 max-h-[60vh] space-y-4 overflow-y-auto pr-2 text-sm text-slate-700">
      
      <!-- pH Bounds -->
      <div formGroupName="ph" class="bg-slate-50 border border-slate-200/80 rounded-xl p-4 space-y-3">
        <h4 class="font-bold text-teal-700">pH Bounds (Two-Sided)</h4>
        <div class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-4">
          <div>
            <label class="text-xs text-slate-500">Warning Min</label>
            <input type="number" step="0.1" formControlName="warnMin"
                   class="mt-1 w-full bg-white border border-slate-300 text-slate-900 text-sm font-mono font-bold rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none" />
          </div>
          <div>
            <label class="text-xs text-slate-500">Safe Min</label>
            <input type="number" step="0.1" formControlName="safeMin"
                   class="mt-1 w-full bg-white border border-slate-300 text-slate-900 text-sm font-mono font-bold rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none" />
          </div>
          <div>
            <label class="text-xs text-slate-500">Safe Max</label>
            <input type="number" step="0.1" formControlName="safeMax"
                   class="mt-1 w-full bg-white border border-slate-300 text-slate-900 text-sm font-mono font-bold rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none" />
          </div>
          <div>
            <label class="text-xs text-slate-500">Warning Max</label>
            <input type="number" step="0.1" formControlName="warnMax"
                   class="mt-1 w-full bg-white border border-slate-300 text-slate-900 text-sm font-mono font-bold rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none" />
          </div>
        </div>
      </div>

      <!-- Other Metrics -->
      <div *ngFor="let param of metrics" [formGroupName]="param.id" class="bg-slate-50 border border-slate-200/80 rounded-xl p-4 space-y-3">
        <h4 class="font-bold text-slate-900">{{ param.label }}</h4>
        <div class="mt-3 grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-500">Safe Upper Limit (🟢)</label>
            <input type="number" [step]="param.step" formControlName="safeMax"
                   class="mt-1 w-full bg-white border border-slate-300 text-slate-900 text-sm font-mono font-bold rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none" />
          </div>
          <div>
            <label class="text-xs text-slate-500">Warning Upper Limit (🟡)</label>
            <input type="number" [step]="param.step" formControlName="warnMax"
                   class="mt-1 w-full bg-white border border-slate-300 text-slate-900 text-sm font-mono font-bold rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none" />
          </div>
        </div>
      </div>

    </form>

    <div class="mt-6 flex flex-col sm:flex-row items-center justify-between border-t border-slate-100 pt-4 gap-4 sm:gap-0">
      <button
        (click)="handleReset()"
        class="flex w-full sm:w-auto items-center justify-center space-x-1.5 px-4 py-2 text-xs font-bold text-slate-700 bg-white border border-slate-300 hover:bg-slate-50 rounded-xl transition-all shadow-sm"
      >
        <lucide-icon [img]="RotateCcwIcon" class="h-4 w-4"></lucide-icon>
        <span>Reset CPCB Defaults</span>
      </button>
      <div class="flex w-full sm:w-auto space-x-3 items-center">
        <button
          (click)="close()"
          class="flex-1 sm:flex-none px-4 py-2 text-xs font-bold text-slate-500 hover:text-slate-800 transition-colors"
        >
          Cancel
        </button>
        <button
          (click)="handleSave()"
          class="flex flex-1 sm:flex-none items-center justify-center gap-2 px-5 py-2 text-xs font-bold text-white bg-teal-600 hover:bg-teal-700 rounded-xl shadow-md shadow-teal-600/30 transition-all"
        >
          <lucide-icon [img]="SaveIcon" class="h-4 w-4"></lucide-icon>
          <span>Save Changes</span>
        </button>
      </div>
    </div>
  </div>
</div>
