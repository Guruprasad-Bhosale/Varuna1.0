<div class="card-panel flex flex-col h-full bg-white rounded-xl border border-border shadow-sm">
  <div class="p-4 border-b border-border flex justify-between items-center bg-surfaceHover">
    <div class="flex items-center gap-2">
      <lucide-icon [img]="CpuIcon" class="w-4 h-4 text-teal"></lucide-icon>
      <h3 class="font-semibold text-navy">Edge Device Health</h3>
    </div>
    <span class="text-[10px] font-bold tracking-wider text-safe bg-safeBg px-2 py-0.5 rounded uppercase">Online</span>
  </div>

  <div class="p-4 flex-1 flex flex-col gap-4">
    <div class="grid grid-cols-2 gap-4">
      <!-- CPU -->
      <div>
        <div class="flex justify-between text-xs text-textMuted mb-1">
          <span>CPU Load</span>
          <span>42%</span>
        </div>
        <div class="h-1.5 w-full bg-surfaceHover rounded-full overflow-hidden">
          <div class="h-full bg-teal w-[42%] rounded-full"></div>
        </div>
      </div>
      <!-- RAM -->
      <div>
        <div class="flex justify-between text-xs text-textMuted mb-1">
          <span>Memory</span>
          <span>68%</span>
        </div>
        <div class="h-1.5 w-full bg-surfaceHover rounded-full overflow-hidden">
          <div class="h-full bg-teal w-[68%] rounded-full"></div>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3 mt-2">
      <div class="flex items-center gap-3 p-2 rounded bg-surfaceHover border border-border">
        <lucide-icon [img]="ThermometerIcon" class="w-4 h-4 text-textMuted"></lucide-icon>
        <div>
          <div class="text-[10px] text-textMuted">Core Temp</div>
          <div class="text-xs font-semibold text-navy">45.2 °C</div>
        </div>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-surfaceHover border border-border">
        <lucide-icon [img]="HardDriveIcon" class="w-4 h-4 text-textMuted"></lucide-icon>
        <div>
          <div class="text-[10px] text-textMuted">Storage</div>
          <div class="text-xs font-semibold text-navy">12.4 GB free</div>
        </div>
      </div>
    </div>

    <div class="mt-auto text-xs text-textMuted pt-2 border-t border-border flex justify-between">
      <span>Uptime: 14d 6h 22m</span>
      <span>v2.4.1-edge</span>
    </div>
  </div>
</div>
