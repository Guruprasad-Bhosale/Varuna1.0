<div class="bg-white border-2 border-slate-900 rounded-2xl p-6 shadow-[4px_4px_0px_0px_#0f172a] space-y-4 flex flex-col h-full w-full">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
    <div>
      <h3 class="text-xl font-black text-slate-900 uppercase tracking-tight">Historical Trends</h3>
      <p class="text-xs text-slate-500 font-bold mt-1">Analyze sensor telemetry across time windows</p>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <select 
        [ngModel]="metric"
        (ngModelChange)="onMetricChange($event)"
        class="px-3 py-1.5 rounded-lg border-2 border-slate-900 font-bold text-xs bg-slate-50 text-slate-900 shadow-[2px_2px_0px_0px_#0f172a] focus:outline-none"
      >
        <option value="safety_score">Water Safety Score</option>
        <option value="ph">pH Level</option>
        <option value="turbidity_ntu">Turbidity</option>
        <option value="ec_us_cm">Electrical Conductivity</option>
      </select>

      <div class="flex items-center gap-1">
        <button 
          *ngFor="let t of ['24h', '7d', '30d']"
          (click)="onTimeRangeChange(t)"
          class="px-3 py-1 text-xs font-black uppercase tracking-wider rounded-lg border-2 border-slate-900 shadow-[2px_2px_0px_0px_#0f172a] hover:-translate-y-0.5 hover:shadow-[3px_3px_0px_0px_#0f172a] active:translate-y-0 active:shadow-[1px_1px_0px_0px_#0f172a] transition-all"
          [ngClass]="timeRange === t ? 'bg-slate-900 text-white' : 'bg-white text-slate-900'"
        >
          {{ t }}
        </button>
      </div>
    </div>
  </div>

  <div class="flex-1 w-full min-h-0" #chartContainer>
    <div echarts [options]="chartOptions" [autoResize]="false" (chartInit)="onChartInit($event)" class="w-full h-full"></div>
  </div>
</div>
