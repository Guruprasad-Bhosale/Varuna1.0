<div class="card-panel h-full flex flex-col relative overflow-hidden bg-white rounded-xl border border-border shadow-sm min-h-[300px]">
  
  <div *ngIf="!latestData" class="absolute inset-0 flex items-center justify-center bg-slate-50 z-10 text-slate-400">
    Loading Map...
  </div>

  <!-- Legend & Filter Overlay -->
  <div class="absolute top-4 left-4 z-[400] bg-white/90 backdrop-blur px-3 py-2 rounded-md border border-border shadow-sm text-xs">
    <h4 class="font-semibold text-navy mb-2">Node Status</h4>
    <div class="flex flex-col gap-1.5">
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-safe block"></span> Safe</div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-moderate block"></span> Moderate</div>
      <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-dangerous block"></span> Dangerous</div>
    </div>
  </div>

  <!-- Leaflet Container -->
  <div #mapElement class="w-full h-full z-0"></div>
</div>
